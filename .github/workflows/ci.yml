name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

# All actions are pinned to full commit SHAs (tag in the trailing comment).
# Bump by resolving the new tag: gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# (dereference annotated tags via git/tags/<sha>).

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.1"        # keep in sync with pyproject.toml [dev]
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: mcp_test
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same hash-checked set the Docker image ships, then test tooling.
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run tests
        env:
          # Test environment variables
          MW_API_BASE_URL: https://test.wiki.local/api.php
          MW_BOT_USERNAME: testbot
          MW_BOT_PASSWORD: testpass
          OPENAI_API_KEY: sk-test-key
          JWT_MW_TO_MCP_SECRET: test-secret-mw-to-mcp-must-be-long-enough-32chars
          JWT_MCP_TO_MW_SECRET: test-secret-mcp-to-mw-must-be-long-enough-32chars
          DATABASE_URL: postgresql+asyncpg://mcp:testpass@localhost:5432/mcp_test
        run: |
          pytest tests/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Run ruff check
        run: ruff check src/ tests/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit resolved runtime dependencies
        # requirements.lock is fully pinned with hashes, so pip-audit can
        # check exactly what ships in the image without resolving.
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict

  docker-build:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    needs: [test, lint, audit]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: mw-mcp-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        # v0.36.0 is the known-good release after the 2026-03 trivy-action
        # supply-chain compromise; keep SHA-pinned.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mw-mcp-server:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Publish on release OR push to main. Note: every push to main moves the
    # `latest` tag (plus an immutable sha-<short> tag); pin VERSION to a
    # sha-/semver tag in production rather than tracking `latest`.
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
