# Production Docker Compose for mw-mcp-server
#
# This configuration is optimized for VPS deployment with:
# - Production-ready settings
# - Resource limits
# - Single uvicorn worker (in-memory embedding queue; see Dockerfile)
# - PostgreSQL with pgvector for embeddings and chat storage
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d

name: mw-mcp-server

services:
  mw-mcp-server:
    image: ghcr.io/labki-org/mw-mcp-server:${VERSION:-latest}
    
    build:
      context: .
      dockerfile: Dockerfile

    # Internal port only - Caddy proxies to this
    expose:
      - "8000"

    env_file:
      - .env

    environment:
      # Fails fast if DB_PASSWORD is unset instead of using an empty password.
      - DATABASE_URL=postgresql+asyncpg://mcp:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/mcp

    depends_on:
      postgres:
        condition: service_healthy

    # -------------------------------
    # Security Hardening
    # -------------------------------
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # -------------------------------
    # Operational Reliability
    # -------------------------------
    restart: unless-stopped

    healthcheck:
      # curl is not in the slim image; probe readiness with the stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # -------------------------------
    # Resource Limits
    # -------------------------------
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      web:
        aliases:
          - mw-mcp-server
      internal: {}

  # -------------------------------
  # PostgreSQL with pgvector
  # -------------------------------
  postgres:
    # pgvector >= 0.7 is required for halfvec; pinned by digest.
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped

    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - internal

volumes:
  pgdata:
    driver: local

networks:
  web:
    external: true
  internal:
    driver: bridge
