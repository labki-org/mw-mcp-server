[project]
name = "mw-mcp-server"
version = "0.1.0"
description = "Production-grade MCP server for MediaWiki and LLM integration"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Daniel Aharoni", email = "user@example.com" }
]

license = { text = "MIT" }

########################################
# Core Runtime Dependencies
########################################
dependencies = [
  # Web framework
  # fastapi>=0.120.1: request-scoped yield-dependency lifetime fix for
  # StreamingResponse (0.118) and allows the patched Starlette below.
  "fastapi>=0.120.1,<1.0.0",
  # FastAPI never raised its Starlette floor, so pin past the advisories
  # explicitly: CVE-2025-54121 (0.47.2) and CVE-2025-62727 Range DoS (0.49.1).
  "starlette>=0.49.1",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  # CVE-2025-43859 (request smuggling); uvicorn only requires h11>=0.8.
  "h11>=0.16.0",

  # Config & validation (Pydantic v2)
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",

  # HTTP client
  "httpx>=0.27.0,<1.0.0",

  # Auth / JWT
  "PyJWT>=2.12.0,<3.0.0",  # CVE-2024-53861, crit header handling

  # Database (PostgreSQL + pgvector)
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "pgvector>=0.3.0,<1.0.0",
  "alembic>=1.13.0,<2.0.0",

  # Text Chunking
  "tiktoken>=0.7.0,<1.0.0",
  "langchain-text-splitters>=1.1.2,<2.0.0",  # CVE-2025-6985, CVE-2026-41481
]

########################################
# Optional Dependency Groups
########################################

[project.optional-dependencies]
test = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "respx>=0.21.0,<1.0.0",         # HTTPX mocking
]

dev = [
  "ruff==0.17.1",  # keep in sync with .github/workflows/ci.yml
  "mypy>=1.9.0,<2.0.0",
  "ipython>=8.0.0,<9.0.0",
]

########################################
# Build System
########################################

[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

########################################
# Tooling Configuration (Optional)
########################################

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so ruff upgrades don't silently change what CI enforces
# (ruff 0.17 widened its default selection to ~400 findings on this tree).
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = [
  "B008",  # FastAPI's Depends()/Query()/Header() default-argument idiom
]
# TODO: run `ruff check --fix` (plus manual B904 fixes) in a dedicated
# follow-up PR once concurrent work on src/ has landed, then drop these.
extend-ignore = [
  "UP006",  # PEP 585 builtin generics (List -> list)
  "UP007",  # PEP 604 unions
  "UP012",  # unnecessary .encode("utf-8")
  "UP017",  # datetime.UTC alias
  "UP035",  # deprecated typing imports
  "UP037",  # quoted annotations
  "UP045",  # Optional[X] -> X | None
  "I001",   # import sorting
  "B007",   # unused loop variable
  "B011",   # assert False
  "B904",   # raise ... from err inside except
  "B905",   # zip() without strict=
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
